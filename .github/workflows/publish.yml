name: Publish to Maven Central
on:
  release: { types: [published] }
  workflow_dispatch:
jobs:
  publish:
    # Apple targets can only be compiled on macOS, so the full multiplatform publication runs there.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@v4
      - name: Publish
        run: ./gradlew publishToMavenCentral --no-configuration-cache -DStitchVersion=${{ github.event.release.tag_name || '1.0.0' }}
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}   # Central Portal user token name
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}   # Central Portal user token secret
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}                # ASCII-armored GPG private key
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
